# Production overlay. Deep-merged onto infra/base.yaml by
# scripts/infra/config.ts. The only environment.
#
# Runtime variables are declared once, in infra/base.yaml `variables:` (the
# per-app ones derived from apps.json): an overlay list would replace that
# list whole. Their production values come from apply.env (README, Deploy).
container:
  name: hyde-mcp-gateway
  # Scale to zero between sessions: the server holds no state and starts in
  # about a second (Node, no build step). Set 1 if a cold start ever stalls a
  # client .
  min-scale: 0
